# pre-commit と CI は同一の scripts/quality-gate.sh を呼ぶ。
# gitleaks は --no-git --source . で作業ツリーをスキャンするため両環境で同じコマンド。
repos:
  - repo: local
    hooks:
      - id: quality-gate
        name: quality-gate (gofmt/vet/staticcheck/golangci/govulncheck/test/gitleaks)
        entry: bash scripts/quality-gate.sh
        language: system
        pass_filenames: false
        stages: [pre-commit]
