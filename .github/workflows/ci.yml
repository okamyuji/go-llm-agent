name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # 共通CI: go vet / build / test（Goバージョンはgo.modから解決）
  ci:
    uses: okamyuji/reusable-workflows/.github/workflows/go-ci.yml@v1

  # 共通セキュリティスキャン: gitleaks（全履歴、GITHUB_TOKEN受け渡しは reusable 側に内蔵）。
  # pre-commit フック内の gitleaks は作業ツリー防衛として残し、こちらは履歴スキャンを担う。
  security:
    uses: okamyuji/reusable-workflows/.github/workflows/security-scan.yml@v1

  pre-commit:
    name: pre-commit (quality-gate + gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.1

      - name: Install golangci-lint
        # v2.12 以前は package facts のキャッシュ不整合で _test.go の t.Fatal 後に
        # SA5011 の誤検出が間欠的に出る (golangci/golangci-lint#5979)。v2.13.0 で修正済み
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks

      - name: Install pre-commit
        run: pip install --upgrade pre-commit

      - name: Run pre-commit hooks (品質ゲート + gitleaks)
        run: pre-commit run --all-files --show-diff-on-failure --color always

      - name: Run hardening verification
        run: bash scripts/verify-hardening.sh

  e2e:
    name: e2e (tests/e2e/*.sh)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.1

      - name: Install golangci-lint
        # v2.12 以前は package facts のキャッシュ不整合で _test.go の t.Fatal 後に
        # SA5011 の誤検出が間欠的に出る (golangci/golangci-lint#5979)。v2.13.0 で修正済み
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks

      - name: Run quality gate with E2E
        env:
          RUN_E2E: "1"
        run: bash scripts/quality-gate.sh
